<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: deep brown brand colour -->
  <rect width="100" height="100" rx="16" fill="#2C1810"/>

  <!-- Subtle inner glow / rim -->
  <rect width="100" height="100" rx="16" fill="none" stroke="#F2C4CE" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Italic serif "D" — Cormorant-style strokes hand-traced -->
  <!-- Stem -->
  <line x1="24" y1="22" x2="24" y2="78" stroke="#F2C4CE" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top serif -->
  <line x1="20" y1="22" x2="32" y2="22" stroke="#F2C4CE" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom serif -->
  <line x1="20" y1="78" x2="32" y2="78" stroke="#F2C4CE" stroke-width="3" stroke-linecap="round"/>
  <!-- Belly curve of D -->
  <path d="M24 22 Q62 22 64 50 Q62 78 24 78" fill="none" stroke="#F2C4CE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thin hairline accent — élégance mark, like an accent stroke -->
  <line x1="50" y1="86" x2="68" y2="86" stroke="#D4A0AE" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
